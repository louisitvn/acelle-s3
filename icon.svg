<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Amazon S3 storage">
  <!-- Same format as the other plugin icons: a 64x64 rx=14 tile, an original
       mark in the vendor's brand colours rather than a copy of the vendor's
       logo. #232F3E is the AWS console navy and #7AA116 the green AWS uses
       for its Storage service family, so the pairing reads as S3 on sight
       without reproducing Amazon's trademark. -->
  <defs>
    <linearGradient id="s3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232F3E"/>
      <stop offset="100%" stop-color="#161E2D"/>
    </linearGradient>
    <linearGradient id="s3-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FBF29"/>
      <stop offset="100%" stop-color="#5E8C10"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#s3-bg)"/>

  <!-- The bucket: a tapered cylinder, wider at the rim than at the base.
       The walls run from the TOP ellipse's centre line down to the BASE
       ellipse's centre line — an ellipse is widest at its centre, so joining
       anywhere else leaves square shoulders poking out at the seam. -->
  <path d="M16 21 L21.5 45.5 A10.5 4 0 0 0 42.5 45.5 L48 21 Z" fill="url(#s3-body)"/>

  <!-- Rim, lighter so the opening reads as an opening -->
  <ellipse cx="32" cy="21" rx="16" ry="5.6" fill="#A5D63F"/>
  <ellipse cx="32" cy="21" rx="11.5" ry="3.6" fill="#4A7209"/>

  <!-- "3" on the body, the one glyph that separates S3 from any other bucket -->
  <text x="32" y="41" text-anchor="middle" fill="#FFFFFF"
        font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700">3</text>
</svg>
